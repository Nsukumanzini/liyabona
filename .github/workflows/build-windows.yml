name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build release app
        run: flutter build windows --release

      - name: Verify speech recognizer is linked into the app
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (Test-Path "$release/speech_to_text_windows_plugin.dll") {
            throw "The separate speech recognition DLL was built. Check the local dependency override."
          }
          if (Test-Path "$release/flutter_tts_plugin.dll") {
            throw "The separate text-to-speech DLL was built. Check the local dependency override."
          }
          if (-not (Test-Path "$release/liyabona.exe")) {
            throw "The Windows executable was not produced."
          }

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Liyabona-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liyabona-Windows
          path: Liyabona-Windows.zip
          if-no-files-found: error
